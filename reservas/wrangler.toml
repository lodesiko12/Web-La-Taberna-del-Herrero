name = "tj-reservas"
main = "src/index.js"
compatibility_date = "2026-01-15"

[vars]
# Orígenes autorizados a llamar al Worker, separados por comas.
# Añade aquí el dominio definitivo cuando publiques.
ALLOWED_ORIGINS = "http://localhost:8788,https://latabernadelherrero.es"

# Los siguientes NO van aquí — son secretos. Se cargan con:
#   npx wrangler secret put SHEET_ID
#   npx wrangler secret put GOOGLE_CLIENT_EMAIL
#   npx wrangler secret put GOOGLE_PRIVATE_KEY
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put FROM_EMAIL
#   npx wrangler secret put NOTIFY_EMAIL
